<!DOCTYPE html>
<!-- data-mantine-color-scheme：暗色預設的 FOUC guard（JS 跑前先套暗色，
     MantineProvider 掛載後再與 localStorage 對帳）。 -->
<html data-mantine-color-scheme="dark">
  <head>
    <!-- title 佔位符由 vite.config.js 的 htmlVars plugin 於 transformIndexHtml
         階段替換（env PTTCHROME_PAGE_TITLE，預設 PttChrome）。 -->
    <title>%PTTCHROME_PAGE_TITLE%</title>
    <link rel="icon" type="image/png" href="/src/icon/logo.png">
    <!-- 安裝成應用程式後，deep link（#<Board>/<AID>）會靠 manifest 的
         launch_handler: focus-existing 交給既有視窗，走 window.launchQueue
         而不是開新分頁（見 src/js/deep_link_entry.js）。路徑必須是相對的：
         站台部署在 GitHub Pages 子路徑（vite.config.mjs base: './'）。 -->
    <link rel="manifest" href="./manifest.webmanifest">

    <!-- 手機版面（docs/mobile.md）：刻意**不**鎖 user-scalable／maximum-scale ——
         雙指縮放是瀏覽器原生行為，看不清時的後援（CLAUDE.md「原生行為一律接入」）。
         刻意**還沒**加 interactive-widget=resizes-content：它讓軟鍵盤開關變成 layout
         resize ⇒ onWindowResize 重算字級，fixed-font-size 下還會改列數、重送 NAWS。
         鍵盤遮住底列的處理見 docs/mobile.md Phase 2。
         viewport-fit=cover：內容畫到瀏海／手勢列底下（原生 App 的 edge-to-edge），
         手機的 App Bar／底部工具列以 env(safe-area-inset-*) 讓位（App._readSafeInsets）。
         theme-color：瀏覽器網址列／狀態列與 App Bar 同色。守護 tests/unit/index_html_meta.test.js。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#141418">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>

    <!-- 好讀模式自動開圖最常打 i.imgur.com；提前完成 DNS+TLS（實測 connect 約
         150ms）。圖片本身不帶 credentials，故不加 crossorigin。 -->
    <link rel="preconnect" href="https://i.imgur.com">

    <!--
      React/react-dom and every dependency are bundled by Vite (React 19
      dropped the UMD build); no runtime CDN <script> deps remain. UI components
      use Mantine (bundled import + @mantine/core/styles.css via entry.js);
      jquery / hammerjs / bootstrap / react-bootstrap have been removed entirely.
    -->
    <script type="module" src="/src/entry.js"></script>

    <!-- 開站載入提示（src/js/boot_loading.js）。快取沒命中時主程式下載可達數秒，原本整片黑。
         樣式／文字全部 inline：**不准**在這塊加任何外部資源（會跟主程式搶頻寬、拖慢下載），
         守護 tests/unit/boot_loading.test.js。延遲 400ms 才淡入：有快取的快速開站不會閃一下。
         動畫只動 transform（合成層，不重排），拆掉元素即停。 -->
    <style>
      html, body { background: #000; }
      #bootLoading {
        position: fixed; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; color: #aaa; font: 15px sans-serif;
        opacity: 0; animation: bootFadeIn 0.2s 0.4s forwards;
      }
      #bootLoading [data-boot="track"] {
        width: min(240px, 60vw); height: 4px; border-radius: 2px;
        background: #333; overflow: hidden;
      }
      #bootLoading [data-boot="bar"] {
        position: relative; overflow: hidden;
        width: 40%; height: 100%; background: #4a90d9;
        transition: width 0.3s ease-out;
      }
      #bootLoading [data-boot="bar"]::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
        transform: translateX(-100%); animation: bootShimmer 1.2s linear infinite;
      }
      #bootLoading[data-failed] [data-boot="track"] { display: none; }
      @keyframes bootFadeIn { to { opacity: 1; } }
      @keyframes bootShimmer { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) {
        #bootLoading [data-boot="bar"]::after { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="bootLoading" role="status">
      <div data-boot="track"><div data-boot="bar"></div></div>
      <div data-boot="label">Downloading…</div>
      <script>
        if (/^zh/i.test(navigator.language || ''))
          document.querySelector('#bootLoading [data-boot="label"]').textContent = '下載程式中…';
      </script>
    </div>
    <span id="cmdHandler"></span>

    <div id="cmenuReact"></div>

    <div id="BBSWindow" style="display:none">
      <!-- 隱藏輸入框（收鍵盤／注音候選）。這個框是**本專案自己畫的**（composition 時
           term_view 給它 border:double 並定位）；OS／瀏覽器只負責畫候選字清單，而清單
           錨在有焦點的 input 的 caret 上 ⇒ 錨在這個 #t。

           **刻意留在 BBSWindow 底下、不放進 .main**：.main 是捲動容器，而它
           left:-10000px —— 一旦成為 scroller 的子孫，瀏覽器對焦時會把捲動容器捲過去。
           曾評估過「composition 時才 appendChild 進 .main、結束再移出」以統一座標系，
           **不可行**：搬動有焦點的元素會先把它從 DOM 移除 ⇒ 失焦 ⇒ 正在進行的 IME
           composition 被中斷（之後補 focus() 也救不回那個 session）。
           座標一致改由 term_view._cellClientRect 解決：#t 錨在「該列真正被畫出來的
           節點」的 getBoundingClientRect()，而 #BBSWindow 是 fixed、貼齊 viewport，
           所以 viewport 座標可以直接當它的 left/top。

           閃爍游標 #cursor 則相反，由 term_view 建在 .main 裡（見 term_view.js 建構子）。 -->
      <input id="t" type="text" autocomplete="off" style="box-sizing:content-box; color:initial; border: none; width: 200px; height: 24px; position:absolute; left:-10000px; top:0px; z-index:2;resize: none; font-family:inherit !important;" autofocus/>
    </div> <!--BBSWindow end-->

    <div id="reactAlert"></div>

    <!-- 圖片上傳的浮層（拖曳遮罩／進度／上傳紀錄面板）。刻意獨立於 #reactAlert：
         那個容器被 ConnectionAlert／PasteShortcutAlert／DeepLinkHandoffAlert 輪流
         獨占（共用同一個 react root），上傳浮層必須能與它們同時存在。 -->
    <div id="imageUploadReact"></div>
  </body>
</html>
