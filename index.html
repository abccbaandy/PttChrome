<!DOCTYPE html>
<!-- data-mantine-color-scheme：暗色預設的 FOUC guard（JS 跑前先套暗色，
     MantineProvider 掛載後再與 localStorage 對帳）。 -->
<html data-mantine-color-scheme="dark">
  <head>
    <!-- title 佔位符由 vite.config.js 的 htmlVars plugin 於 transformIndexHtml
         階段替換（env PTTCHROME_PAGE_TITLE，預設 PttChrome）。 -->
    <title>%PTTCHROME_PAGE_TITLE%</title>
    <link rel="icon" type="image/png" href="/src/icon/logo.png">
    <!-- 安裝成應用程式後，deep link（#<Board>/<AID>）會靠 manifest 的
         launch_handler: focus-existing 交給既有視窗，走 window.launchQueue
         而不是開新分頁（見 src/js/deep_link_entry.js）。路徑必須是相對的：
         站台部署在 GitHub Pages 子路徑（vite.config.mjs base: './'）。 -->
    <link rel="manifest" href="./manifest.webmanifest">

    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>

    <!-- 好讀模式自動開圖最常打 i.imgur.com；提前完成 DNS+TLS（實測 connect 約
         150ms）。圖片本身不帶 credentials，故不加 crossorigin。 -->
    <link rel="preconnect" href="https://i.imgur.com">

    <!--
      React/react-dom and every dependency are bundled by Vite (React 19
      dropped the UMD build); no runtime CDN <script> deps remain. UI components
      use Mantine (bundled import + @mantine/core/styles.css via entry.js);
      jquery / hammerjs / bootstrap / react-bootstrap have been removed entirely.
    -->
    <script type="module" src="/src/entry.js"></script>
  </head>

  <body>
    <span id="cmdHandler"></span>

    <div id="cmenuReact"></div>

    <div id="BBSWindow" style="display:none">
      <!-- 隱藏輸入框（收鍵盤／注音候選）。這個框是**本專案自己畫的**（composition 時
           term_view 給它 border:double 並定位）；OS／瀏覽器只負責畫候選字清單，而清單
           錨在有焦點的 input 的 caret 上 ⇒ 錨在這個 #t。

           **刻意留在 BBSWindow 底下、不放進 .main**：.main 是捲動容器，而它
           left:-10000px —— 一旦成為 scroller 的子孫，瀏覽器對焦時會把捲動容器捲過去。
           曾評估過「composition 時才 appendChild 進 .main、結束再移出」以統一座標系，
           **不可行**：搬動有焦點的元素會先把它從 DOM 移除 ⇒ 失焦 ⇒ 正在進行的 IME
           composition 被中斷（之後補 focus() 也救不回那個 session）。
           座標一致改由 term_view._cellClientRect 解決：#t 錨在「該列真正被畫出來的
           節點」的 getBoundingClientRect()，而 #BBSWindow 是 fixed、貼齊 viewport，
           所以 viewport 座標可以直接當它的 left/top。

           閃爍游標 #cursor 則相反，由 term_view 建在 .main 裡（見 term_view.js 建構子）。 -->
      <input id="t" type="text" autocomplete="off" style="box-sizing:content-box; color:initial; border: none; width: 200px; height: 24px; position:absolute; left:-10000px; top:0px; z-index:2;resize: none; font-family:inherit !important;" autofocus/>
    </div> <!--BBSWindow end-->

    <div id="reactAlert"></div>

    <!-- 圖片上傳的浮層（拖曳遮罩／進度／上傳紀錄面板）。刻意獨立於 #reactAlert：
         那個容器被 ConnectionAlert／PasteShortcutAlert／DeepLinkHandoffAlert 輪流
         獨占（共用同一個 react root），上傳浮層必須能與它們同時存在。 -->
    <div id="imageUploadReact"></div>
  </body>
</html>
