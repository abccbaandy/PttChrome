<!DOCTYPE html>
<!--
  Alt+A~Z 的瀏覽器歸屬量測頁（dev-only）。
  用法：yarn start 後用**你自己的 Chrome / Firefox** 開 http://localhost:8080/tools/alt-key-probe.html
  這頁不會進 vite build（build input 只有根目錄 index.html）。

  為什麼不能用 Playwright 量：CDP 的 Input.dispatchKeyEvent 不經過 browser chrome 的快捷鍵
  分派，量到的永遠是「都收得到、preventDefault 都有效」的假綠。只能人工按。

  量這個做什麼：Alt 全面 remap 成 PTT 的 Ctrl 之後，「系統 > 我們」這條原則不靠黑名單，
  靠一個事實 —— 瀏覽器**保留**的快捷鍵根本不會把 keydown 送到頁面，收不到就不會 remap。
  這頁就是驗證該前提，並找出例外（收得到 keydown、但 preventDefault 之後瀏覽器仍有動作
  ＝雙重觸發），那些字母才需要進 term_keyboard.js 的 ALT_REMAP_EXCLUDE。

  兩趟是關鍵：
    Pass 1（不 preventDefault）＝ 這顆鍵**原本**會發生什麼。
    Pass 2（preventDefault）  ＝ 我們攔了之後還會不會發生。
  沒有 Pass 1 就分不出「preventDefault 有效」與「這顆本來就沒快捷鍵」。
-->
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Alt key probe</title>
    <style>
      body {
        background: #1a1b1e;
        color: #c1c2c5;
        font: 14px/1.6 system-ui, "Microsoft JhengHei", sans-serif;
        margin: 0;
        padding: 24px;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .sub { color: #909296; margin-bottom: 16px; }
      button {
        background: #2c2e33; color: #c1c2c5; border: 1px solid #5c5f66;
        border-radius: 4px; padding: 6px 14px; cursor: pointer; margin-right: 8px;
      }
      button.primary { background: #1971c2; border-color: #1971c2; color: #fff; }
      button.danger { background: #a51111; border-color: #a51111; color: #fff; }
      button:disabled { opacity: 0.4; cursor: default; }
      .card {
        border: 1px solid #373a40; border-radius: 6px; padding: 12px 16px;
        margin-bottom: 16px; background: #25262b;
      }
      #prompt { font-size: 30px; font-weight: 600; color: #fff; margin: 6px 0 2px; }
      #passLabel { color: #ffd43b; }
      #hint { color: #909296; min-height: 1.6em; }
      #auto { color: #4dabf7; min-height: 1.6em; font-size: 13px; }
      #sink {
        position: fixed; opacity: 0; pointer-events: none; top: 0; left: 0; width: 1px; height: 1px;
      }
      table { border-collapse: collapse; width: 100%; font-size: 13px; }
      th, td { border-bottom: 1px solid #373a40; padding: 3px 8px; text-align: left; }
      th { color: #909296; font-weight: normal; }
      .ok { color: #40c057; }
      .warn { color: #fa5252; }
      .dim { color: #707278; }
      .grid { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
      .cell {
        width: 26px; height: 26px; line-height: 26px; text-align: center;
        border: 1px solid #373a40; border-radius: 3px; font-size: 12px;
      }
      .cell.done { background: #2b3b2b; border-color: #40c057; }
      .cell.excl { background: #3b2b2b; border-color: #fa5252; }
      .cell.cur { border-color: #ffd43b; color: #ffd43b; }
      textarea {
        width: 100%; height: 220px; background: #1a1b1e; color: #c1c2c5;
        border: 1px solid #373a40; border-radius: 4px; font: 12px/1.5 ui-monospace, monospace;
        padding: 8px; box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h1>Alt + A~Z 的瀏覽器歸屬量測</h1>
    <div class="sub">
      每顆字母按兩趟：<b>Pass 1</b> 不攔（看瀏覽器原本做什麼）、<b>Pass 2</b> 攔（看還會不會做）。
      按 <b>Esc</b> 跳過目前這顆。焦點被搶走（例如網址列）時，點回本頁即可繼續。
    </div>

    <div class="card">
      <div id="passLabel"></div>
      <div id="prompt">準備中…</div>
      <div id="hint"></div>
      <div id="auto"></div>
      <div style="margin-top: 10px">
        <button id="noKeydownBtn">頁面沒收到 keydown（瀏覽器吃掉了）</button>
        <button id="skipBtn">跳過這顆（Esc）</button>
        <button id="restartBtn" class="danger">重來</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="card" id="askCard" hidden>
      <div><b id="askText"></b></div>
      <div class="sub" style="margin: 2px 0 8px" id="askSub"></div>
      <button id="reactedBtn">有反應（開選單／跳網址列／換分頁…）</button>
      <button id="noReactBtn" class="primary">沒反應</button>
    </div>

    <div class="card">
      <b>結果</b>
      <div class="sub" style="margin: 2px 0 8px">
        結論欄的判準：Pass 1 收不到 keydown ＝ 瀏覽器保留（<b>不需要排除表</b>，收不到就不會 remap）；
        收得到但 Pass 2 仍有反應 ＝ <b>雙重觸發</b>，該字母要進 ALT_REMAP_EXCLUDE。
      </div>
      <table>
        <thead>
          <tr>
            <th>字母</th><th>P1 原生行為</th><th>keydown 到頁面</th>
            <th>e.key</th><th>e.code</th><th>keyCode</th><th>組字</th>
            <th>P2 仍有反應</th><th>結論</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="card">
      <b>貼進 docs 的 Markdown</b>
      <div style="margin: 6px 0">
        <button id="copyBtn" class="primary">複製 Markdown</button>
        <span id="copyMsg" class="dim"></span>
      </div>
      <textarea id="out" readonly></textarea>
    </div>

    <input id="sink" />

    <script>
      const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      // 焦點被 browser chrome 搶走 / 組字事件到達，都不是同步發生的，給它一個窗。
      const SIGNAL_WINDOW_MS = 700;

      const el = (id) => document.getElementById(id);
      const sink = el('sink');

      let idx = 0;
      let pass = 1;
      let awaiting = false;
      let pending = null; // 這一趟收集中的樣本
      let results = {}; // letter -> { p1: {...}, p2: {...} }

      const blank = () => ({
        arrived: false, key: '', code: '', keyCode: '', isComposing: false,
        composition: [], autoBlur: false, reacted: null
      });

      function focusSink() {
        // 組字只在有焦點的文字欄位裡發生，所以一定要讓焦點待在 sink 上
        // （對應真實 app 的隱藏 input #t）。
        try { sink.focus({ preventScroll: true }); } catch (_) { sink.focus(); }
      }

      function render() {
        el('passLabel').textContent = idx < LETTERS.length
          ? 'Pass ' + pass + (pass === 1 ? '（不攔，看原本會發生什麼）' : '（攔，看還會不會發生）')
          : '';
        el('prompt').textContent = idx < LETTERS.length
          ? '請按  Alt + ' + LETTERS[idx]
          : '量完了 ✓';
        const grid = el('grid');
        grid.innerHTML = '';
        LETTERS.forEach((L, i) => {
          const d = document.createElement('div');
          d.className = 'cell';
          d.textContent = L;
          const r = results[L];
          if (r && r.p2) d.className += verdictOf(L).exclude ? ' excl' : ' done';
          if (i === idx) d.className += ' cur';
          grid.appendChild(d);
        });
        renderRows();
        renderMarkdown();
      }

      function verdictOf(L) {
        const r = results[L] || {};
        const p1 = r.p1, p2 = r.p2;
        if (!p1 || !p2) return { text: '—', exclude: false };
        if (p1.skipped || p2.skipped) return { text: '跳過', exclude: false };
        if (!p1.arrived) return { text: '瀏覽器保留（收不到 keydown，零成本）', exclude: false };
        if (p2.reacted) return { text: '⚠ 雙重觸發 → 加進 ALT_REMAP_EXCLUDE', exclude: true };
        return { text: 'remap', exclude: false };
      }

      function compText(s) {
        if (!s || !s.composition.length) return '—';
        return s.composition.join(' ');
      }

      function renderRows() {
        const tb = el('rows');
        tb.innerHTML = '';
        LETTERS.forEach((L) => {
          const r = results[L];
          if (!r || !r.p1) return;
          const p1 = r.p1, p2 = r.p2 || blank();
          const v = verdictOf(L);
          const tr = document.createElement('tr');
          const cells = [
            L,
            p1.reacted === null ? '—' : (p1.reacted ? '有反應' : '無'),
            p1.arrived ? '✓' : '✗',
            p1.key === '' ? '—' : JSON.stringify(p1.key),
            p1.code || '—',
            p1.keyCode === '' ? '—' : String(p1.keyCode),
            compText(p1),
            r.p2 ? (p2.reacted ? '⚠ 是' : '否') : '—',
            v.text
          ];
          cells.forEach((c, i) => {
            const td = document.createElement('td');
            td.textContent = c;
            if (i === 8) td.className = v.exclude ? 'warn' : (c === 'remap' ? 'ok' : 'dim');
            if (i === 2) td.className = p1.arrived ? 'ok' : 'dim';
            tr.appendChild(td);
          });
          tb.appendChild(tr);
        });
      }

      function browserLabel() {
        const ua = navigator.userAgent;
        let m = /Firefox\/([\d.]+)/.exec(ua);
        if (m) return 'Firefox ' + m[1];
        m = /Edg\/([\d.]+)/.exec(ua);
        if (m) return 'Edge ' + m[1];
        m = /Chrome\/([\d.]+)/.exec(ua);
        if (m) return 'Chrome ' + m[1];
        m = /Version\/([\d.]+).*Safari/.exec(ua);
        if (m) return 'Safari ' + m[1];
        return 'Unknown';
      }

      function platformLabel() {
        const p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
        return p || 'unknown';
      }

      function renderMarkdown() {
        const done = LETTERS.filter((L) => results[L] && results[L].p2);
        const date = new Date().toISOString().slice(0, 10);
        const lines = [];
        lines.push('### ' + browserLabel() + ' / ' + platformLabel() + '（' + date + '）');
        lines.push('');
        lines.push('| 字母 | P1 原生行為 | keydown 到頁面 | e.key | e.code | keyCode | 組字 | P2 仍有反應 | 結論 |');
        lines.push('|---|---|---|---|---|---|---|---|---|');
        done.forEach((L) => {
          const p1 = results[L].p1;
          const p2 = results[L].p2;
          const v = verdictOf(L);
          lines.push('| ' + [
            L,
            p1.reacted ? '有反應' : '無',
            p1.arrived ? '✓' : '✗',
            p1.key === '' ? '—' : '`' + p1.key + '`',
            p1.code || '—',
            p1.keyCode === '' ? '—' : p1.keyCode,
            compText(p1),
            p2.reacted ? '⚠ 是' : '否',
            v.text
          ].join(' | ') + ' |');
        });
        const excl = LETTERS.filter((L) => verdictOf(L).exclude);
        lines.push('');
        lines.push('`ALT_REMAP_EXCLUDE` = `' + "'" + excl.join('') + "'" + '`' +
          (excl.length ? '' : '（零排除表，決策 3 的前提成立）'));
        lines.push('');
        lines.push('UA: `' + navigator.userAgent + '`');
        el('out').value = lines.join('\n');
      }

      // ---- 一趟的收集 ---------------------------------------------------------

      function startTrial() {
        pending = blank();
        awaiting = true;
        el('hint').textContent = '';
        el('auto').textContent = '';
        el('askCard').hidden = true;
        focusSink();
        render();
      }

      function finishTrial(sample) {
        awaiting = false;
        const L = LETTERS[idx];
        results[L] = results[L] || {};
        results[L]['p' + pass] = sample;
        if (pass === 1) {
          pass = 2;
        } else {
          pass = 1;
          idx++;
        }
        if (idx >= LETTERS.length) {
          el('prompt').textContent = '量完了 ✓';
          el('passLabel').textContent = '';
          el('hint').textContent = '按「複製 Markdown」把結果貼回來。';
          el('askCard').hidden = true;
          render();
          return;
        }
        startTrial();
      }

      // keydown 收到之後，等一個窗看有沒有「焦點被搶走」的自動訊號，再問人。
      function afterKeydown(sample) {
        awaiting = false;
        el('hint').textContent = 'keydown 收到了：key=' + JSON.stringify(sample.key) +
          ' code=' + (sample.code || '—') + ' keyCode=' + sample.keyCode;
        setTimeout(() => {
          const autoMsg = [];
          if (sample.autoBlur) autoMsg.push('偵測到焦點離開本頁 ⇒ 八成是瀏覽器接手了');
          if (sample.composition.length) autoMsg.push('觸發了組字事件：' + sample.composition.join(' '));
          el('auto').textContent = autoMsg.join('；');
          ask(sample);
        }, SIGNAL_WINDOW_MS);
      }

      function ask(sample) {
        el('askCard').hidden = false;
        el('askText').textContent = pass === 1
          ? '剛才按 Alt + ' + LETTERS[idx] + '，瀏覽器有做什麼嗎？'
          : '我們已經 preventDefault 了，瀏覽器還是有做什麼嗎？';
        el('askSub').textContent = pass === 1
          ? '例如：開選單、跳到網址列、換分頁、開新視窗。沒看到任何變化就選「沒反應」。'
          : '有反應 ＝ 這顆攔不住（雙重觸發），會被列進排除表。';
        // 自動訊號當預設：焦點被搶走幾乎一定是瀏覽器接手。
        (sample.autoBlur ? el('reactedBtn') : el('noReactBtn')).focus();
        el('askCard').dataset.pendingReacted = '';
        pendingSample = sample;
      }

      let pendingSample = null;

      function answer(reacted) {
        if (!pendingSample) return;
        const s = pendingSample;
        pendingSample = null;
        s.reacted = reacted;
        el('askCard').hidden = true;
        finishTrial(s);
      }

      // ---- 事件 ---------------------------------------------------------------

      window.addEventListener('keydown', (e) => {
        if (!awaiting) return;
        if (e.key === 'Escape') {
          const s = blank();
          s.skipped = true;
          finishTrial(s);
          return;
        }
        if (!e.altKey) {
          el('hint').textContent = '（這顆沒按 Alt，忽略。請按 Alt + ' + LETTERS[idx] + '）';
          return;
        }
        // Alt 本身的 keydown 不算。
        if (e.key === 'Alt' || /^Alt/.test(e.code || '')) return;
        if (e.ctrlKey || e.metaKey) {
          el('hint').textContent = '（別同時按 Ctrl / Cmd，那是另一種組合）';
          return;
        }

        pending.arrived = true;
        pending.key = e.key;
        pending.code = e.code || '';
        pending.keyCode = e.keyCode;
        pending.isComposing = !!e.isComposing;
        pending.repeat = !!e.repeat;

        // Pass 2 才攔。Pass 1 刻意放行，讓瀏覽器照原樣動作一次。
        if (pass === 2) e.preventDefault();

        const expected = 'Key' + LETTERS[idx];
        if (pending.code && pending.code !== expected) {
          el('hint').textContent = '⚠ 按到的是 ' + pending.code + '，預期 ' + expected + '。仍然記錄。';
        }
        afterKeydown(pending);
      }, true);

      ['compositionstart', 'compositionupdate', 'compositionend', 'beforeinput', 'input'].forEach((type) => {
        sink.addEventListener(type, (e) => {
          if (!pending) return;
          const d = e.data === undefined || e.data === null ? '' : String(e.data);
          pending.composition.push(type + (d ? '(' + d + ')' : ''));
          // 量測頁自己不該累積字元，否則下一顆的組字判斷會被污染。
          if (type === 'input') sink.value = '';
        });
      });

      window.addEventListener('blur', () => { if (pending) pending.autoBlur = true; });
      document.addEventListener('visibilitychange', () => {
        if (pending && document.hidden) pending.autoBlur = true;
      });
      // 焦點被 browser chrome 搶走之後點回本頁：把焦點還給 sink，不然後面全部收不到。
      window.addEventListener('focus', () => { if (awaiting) focusSink(); });
      document.addEventListener('click', () => { if (awaiting) focusSink(); });

      el('noKeydownBtn').addEventListener('click', () => {
        if (!awaiting) return;
        const s = pending;
        s.arrived = false;
        awaiting = false;
        ask(s);
      });
      el('skipBtn').addEventListener('click', () => {
        if (!awaiting) return;
        const s = blank();
        s.skipped = true;
        finishTrial(s);
      });
      el('restartBtn').addEventListener('click', () => {
        results = {};
        idx = 0;
        pass = 1;
        pendingSample = null;
        startTrial();
      });
      el('reactedBtn').addEventListener('click', () => answer(true));
      el('noReactBtn').addEventListener('click', () => answer(false));
      el('copyBtn').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(el('out').value);
          el('copyMsg').textContent = '已複製';
        } catch (_) {
          el('out').select();
          el('copyMsg').textContent = '複製失敗，請手動選取';
        }
        setTimeout(() => { el('copyMsg').textContent = ''; }, 2000);
      });

      startTrial();
    </script>
  </body>
</html>
