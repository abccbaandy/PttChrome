<!DOCTYPE html>
<html>
  <head>
    <title><%= process.env.PTTCHROME_PAGE_TITLE %></title>
    <link rel="icon" type="image/png" href="<%= require('./icon/logo.png') %>">

    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>

    <!--
      jQuery and hammerjs come from CDN (unpkg) instead of bundling: webpack
      `externals` maps the jquery import to the global; hammerjs is global-only.
      Versions are read from the installed packages (require(...).version) so the
      CDN URL can't drift from package.json/yarn.lock. React/react-dom are NO
      longer here — React 19 dropped the UMD build, so they are bundled by
      webpack (a ProvidePlugin supplies the bare `React` global to source). These
      scripts execute at parse time, before the webpack bundle (html-webpack-plugin
      injects it after, as a deferred script). Only bootstrap's CSS is loaded:
      react-bootstrap 2 reimplements all modal/dropdown/tooltip behaviour in React
      (no jQuery plugin), so bootstrap's JS bundle is dead weight and is
      intentionally not loaded.
    -->
    <link rel="stylesheet" crossorigin="anonymous" href="https://unpkg.com/bootstrap@<%= require('bootstrap/package.json').version %>/dist/css/bootstrap.min.css">
    <script crossorigin="anonymous" src="https://unpkg.com/jquery@<%= require('jquery/package.json').version %>/dist/jquery.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/hammerjs@<%= require('hammerjs/package.json').version %>/hammer.min.js"></script>
  </head>

  <body>
    <span id="cmdHandler"></span>

    <div id="cmenuReact"></div>

    <div id="BBSWindow" style="display:none">
      <input id="t" type="text" autocomplete="off" style="box-sizing:content-box; color:initial; border: none; width: 200px; height: 24px; position:absolute; left:-10000px; top:0px; z-index:2;resize: none; font-family:inherit !important;" autofocus/>
      <div id="cursor" class="terminal_display">_</div>
    </div> <!--BBSWindow end-->

    <div id="reactAlert"></div>
  </body>
</html>
