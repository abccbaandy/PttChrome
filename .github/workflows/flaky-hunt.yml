name: Flaky Hunt

# 每晚把 unit／integration／offline e2e（含逆境圖片情境）在 dev 上重複跑 N 輪，主動找出偶發紅。
# 單次 push 的 CI（test.yml）一輪就過，偶發紅要等它剛好擋到部署才會被看到；這裡把
# 「機率性」換成「重複次數」，在使用者 push 前先抓到。測試框架層刻意不 retry
# （tests/unit/no_test_retry.test.js），所以任何一輪紅＝真的 flaky。
#
# 紅了會開（或在既有的上面留言）一個 issue，標題固定「Nightly flaky hunt 失敗」；新開的 issue
# 會觸發 Claude routine 去修，所以手動 dispatch 的紅與過時紅只續寫、不新開（見 report job）。
# issue 開超過 3 天還沒關 ⇒ watchdog job @ repo owner 一次。
# `yarn ci:status` 不把這個 workflow 算進「這次 push 的 CI」（scripts/ci-status.mjs#isProjectRun）。
# 不含 live e2e（PTT 登入預算）。Android 模擬器（開機成本高）每週只跑一輪少量重複
# （android-repeat job，哪一天由 gate 決定，見 scripts/flaky-hunt-gate.mjs#decideAndroid）。
# 下面幾處「看起來多餘」的設定由 tests/unit/flaky_hunt_workflow.test.js 鎖住，別順手改回。
on:
  # GitHub 的 schedule 高負載時會延遲（實測天天晚 ~3h、最多 +5h）也可能直接丟，不保證；整點是全站
  # 尖峰。所以掛三個非整點 cron 當備援，由 gate job 去重：每天（UTC 21:00 起算）只有第一個真的跑。
  schedule:
    - cron: "17 21 * * *" # 台灣時間 05:17
    - cron: "17 3 * * *" # 台灣時間 11:17
    - cron: "17 9 * * *" # 台灣時間 17:17
  workflow_dispatch:
    inputs:
      repeat:
        description: "每個套件重複幾輪"
        default: "10"
      # 驗證修正時只跑出事的那條：全套 10 輪對單輪 9% 的 flaky 只有 61% 抓得到，
      # 只跑一條就能把 repeat 拉到 50 以上。
      suite:
        description: "只跑哪個套件"
        type: choice
        default: all
        # android 不在 all 裡：模擬器只有明確選它才跑（排程則是每週一次）。
        options: [all, unit, integration, e2e-offline, e2e-adverse, android]
      grep:
        description: "只跑名稱符合的 test（傳給 vitest -t／playwright --grep；空白＝全部）"
        default: ""

permissions:
  contents: read

# 按 ref 分組：不分組時，session 在 PR branch dispatch 驗證會取消 dev 正在跑的 nightly
# （cancelled 不算 failure()，不開 issue，那天白跑也沒人知道），反之亦然。
# 不 cancel-in-progress：多個 cron 同時在 dev 上時，後到的排隊等前一輪結束再由 gate 跳過；
# cancel 的話後到的會砍掉先跑的，兩輪都跑不完。
concurrency:
  group: flaky-hunt-${{ github.ref }}
  cancel-in-progress: false

env:
  # 預設 10 輪：以最近部署紅率估（22 次裡 2 次是 flaky，單輪約 9%），每晚抓到的機率
  # 3 輪 25%、10 輪 61%；單輪 2% 的低頻 flaky 10 輪也有 18%。
  REPEAT: ${{ github.event.inputs.repeat || '10' }}
  # Android 每輪約 1 分鐘、外加模擬器開機約 2 分鐘；每週 5 輪。
  ANDROID_REPEAT: ${{ github.event.inputs.repeat || '5' }}
  GREP: ${{ github.event.inputs.grep }}

jobs:
  # 今天（UTC 21:00 起）dev 上已經有算數的 run ⇒ skip=true，其餘 job 全部跳過。
  # workflow_dispatch 永不跳過。規則與理由見 scripts/flaky-hunt-gate.mjs。
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.g.outputs.skip }}
      android: ${{ steps.g.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/flaky-hunt-gate.mjs
          sparse-checkout-cone-mode: false
      - id: g
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SUITE: ${{ inputs.suite }}
        run: node scripts/flaky-hunt-gate.mjs

  # 同 test.yml：e2e／unit 的 container image 版本＝yarn.lock 裡的 @playwright/test。
  playwright-version:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            yarn.lock
            scripts/playwright-version.mjs
          sparse-checkout-cone-mode: false
      - id: v
        run: node scripts/playwright-version.mjs >> "$GITHUB_OUTPUT"

  # 每輪都跑完再判（不在第一個紅停下）：要看到「N 輪紅幾輪」，log 裡逐輪標示。
  unit-repeat:
    needs: [gate, playwright-version]
    if: needs.gate.outputs.skip != 'true' && contains(fromJSON('["all","unit"]'), inputs.suite || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - name: Unit tests × ${{ env.REPEAT }}
        shell: bash
        run: |
          args=()
          if [ -n "$GREP" ]; then args=(-t "$GREP"); fi
          fails=0
          for i in $(seq "$REPEAT"); do
            echo "::group::unit round $i/$REPEAT"
            if yarn test:unit "${args[@]}"; then echo "round $i: pass"; else echo "::error::unit round $i/$REPEAT failed"; fails=$((fails+1)); fi
            echo "::endgroup::"
          done
          echo "unit: $fails/$REPEAT rounds failed"
          test "$fails" = 0

  integration-repeat:
    needs: gate
    if: needs.gate.outputs.skip != 'true' && contains(fromJSON('["all","integration"]'), inputs.suite || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      # 每輪 run-integration.mjs 都重開容器 ⇒ 每輪都是冷啟動（舊 flaky 的觸發條件）。
      - name: Integration tests × ${{ env.REPEAT }}
        shell: bash
        env:
          INTEGRATION_TIMEOUT_MS: "30000"
        run: |
          args=()
          if [ -n "$GREP" ]; then args=(-t "$GREP"); fi
          fails=0
          for i in $(seq "$REPEAT"); do
            echo "::group::integration round $i/$REPEAT"
            if yarn test:integration "${args[@]}"; then echo "round $i: pass"; else echo "::error::integration round $i/$REPEAT failed"; fails=$((fails+1)); fi
            echo "::endgroup::"
          done
          echo "integration: $fails/$REPEAT rounds failed"
          test "$fails" = 0

  # --repeat-each：每條 test 跑 N 次，fullyParallel 下會被拆到不同 worker／shard。
  e2e-offline-repeat:
    needs: [gate, playwright-version]
    if: needs.gate.outputs.skip != 'true' && contains(fromJSON('["all","e2e-offline"]'), inputs.suite || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      # 帶 grep 時多數 shard 分不到 test：--pass-with-no-tests 讓空 shard 綠（grep 打錯會整批空綠，看 log 的 test 數）。
      - name: Offline E2E × ${{ env.REPEAT }} (shard ${{ matrix.shard }}/8)
        shell: bash
        run: |
          args=()
          if [ -n "$GREP" ]; then args=(--grep "$GREP" --pass-with-no-tests); fi
          yarn install --immutable
          yarn test:e2e:offline --repeat-each="$REPEAT" --shard=${{ matrix.shard }}/8 "${args[@]}"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-hunt-e2e-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14

  # 逆境圖片情境（慢／404／301／混合）：每個 PR 都必跑（test.yml 的 adverse job），所以一樣要重複輪測。
  # matrix 比照 test.yml（slow 桶最慢再拆兩片）；一輪約 2～3 分，×10 輪仍在 timeout 內。
  # 每桶的 shard 必須 1..shards 一個不漏（守護 tests/unit/flaky_hunt_workflow.test.js）。
  e2e-adverse-repeat:
    needs: [gate, playwright-version]
    if: needs.gate.outputs.skip != 'true' && contains(fromJSON('["all","e2e-adverse"]'), inputs.suite || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - bucket: offline-slow
            workers: 8
            shard: 1
            shards: 2
          - bucket: offline-slow
            workers: 8
            shard: 2
            shards: 2
          - bucket: offline-broken
            workers: 4
            shard: 1
            shards: 1
          - bucket: offline-mixed
            workers: 4
            shard: 1
            shards: 1
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      # 帶 grep 時同 e2e-offline-repeat：空 shard 用 --pass-with-no-tests 維持綠。
      - name: Adverse E2E × ${{ env.REPEAT }} (${{ matrix.bucket }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
        shell: bash
        env:
          E2E_WORKERS: ${{ matrix.workers }}
        run: |
          args=()
          if [ -n "$GREP" ]; then args=(--grep "$GREP" --pass-with-no-tests); fi
          yarn install --immutable
          yarn test:e2e:offline:adverse --only=${{ matrix.bucket }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --repeat-each="$REPEAT" "${args[@]}"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-hunt-adverse-${{ matrix.bucket }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14

  # Android 模擬器上的真 Chrome（同 test.yml 的 test-e2e-android，步驟要跟著它改）。
  # 每週一次（gate 的 android 輸出），--repeat-each 經 run-android-e2e.mjs 轉給 playwright。
  # runner exit 2（模擬器環境沒準備好）一樣是紅：判讀見 docs/ci-troubleshooting.md。
  android-repeat:
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # 同 test.yml：資源取樣（模擬器中途整台消失時，看 runner 記憶體／CPU 是不是被吃光）、
      # 系統映像從 cache 還原（守護 tests/unit/ci_resource_monitor.test.js）。
      - name: Runner resources
        run: node scripts/ci-resource-monitor.mjs start
      - name: Cache Android system image
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: android-sysimg-34-google_apis-x86_64-v1
      # grep 經 env 傳（不內插進 shell）；空 grep 就不帶。
      - name: Android e2e × ${{ env.ANDROID_REPEAT }} (emulator)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_E2E_APK: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: pttchrome_e2e
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node scripts/run-android-e2e.mjs --no-boot --repeat-each="$ANDROID_REPEAT" ${GREP:+--grep "$GREP" --pass-with-no-tests}
      - name: Runner resources report
        if: always()
        run: node scripts/ci-resource-monitor.mjs report
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-hunt-android-attempt-${{ github.run_attempt }}
          path: |
            test-results/
            ci-diagnostics/
          retention-days: 14

  # 紅了要讓人看得到：排程 run 的失敗通知只寄給最後改 cron 的人，很容易漏。
  # gate 跳過時上面全是 skipped（≠ failure），這裡不會被觸發。
  report:
    needs: [unit-repeat, integration-repeat, e2e-offline-repeat, e2e-adverse-repeat, android-repeat]
    # 只有 dev 的紅才寫 issue：在工作分支上手動 dispatch 是拿來驗修正或收證據的
    # （常帶暫時的除錯碼），那邊的紅看 run 本身就好，開 issue 只會誤報。
    if: failure() && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/flaky-hunt-report.mjs
          sparse-checkout-cone-mode: false
      # 「新開 issue」會觸發 routine「fix Nightly flaky hunt 失敗」起 Claude session ⇒ 只有
      # schedule、且跑的 commit 仍是 dev HEAD 時能開新的；workflow_dispatch（session 修完的驗證 run）
      # 與過時紅只續寫既有 issue，否則會連鎖或重修。決策表守護在 tests/unit/flaky_hunt_report.test.js。
      - name: Open or update the flaky issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: "unit=${{ needs.unit-repeat.result }} integration=${{ needs.integration-repeat.result }} e2e-offline=${{ needs.e2e-offline-repeat.result }} e2e-adverse=${{ needs.e2e-adverse-repeat.result }} android=${{ needs.android-repeat.result }}"
        run: node scripts/flaky-hunt-report.mjs

  # issue 開太久（session 中途死掉）就通知人。每次 run 都跑、不管紅綠：nightly 可能連續幾天綠，
  # report 不會跑。規則見 scripts/flaky-hunt-watchdog.mjs。
  watchdog:
    needs: [gate, report]
    if: always() && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/flaky-hunt-report.mjs
            scripts/flaky-hunt-watchdog.mjs
          sparse-checkout-cone-mode: false
      - name: Flag stalled flaky issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/flaky-hunt-watchdog.mjs
