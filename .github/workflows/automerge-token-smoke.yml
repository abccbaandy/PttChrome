name: Auto-merge token smoke test

# 一次性驗證用，驗完即刪：確認 dependabot-auto-merge.yml 所需的兩個 secret
# （AUTOMERGE_APP_CLIENT_ID / AUTOMERGE_APP_PRIVATE_KEY）設定正確、GitHub App 已
# 安裝到本 repo、且授予的權限足夠 merge PR。不做任何寫入，也不會印出 token 本身。
on: workflow_dispatch

# 全程用 App token，GITHUB_TOKEN 一概不需要。
permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # permission-* 是「向這次 token 索取的權限」：App 安裝時若沒被授予 Contents /
      # Pull requests 的 write，GitHub 會直接回 422，這一步就紅 —— 等於在不寫入任何
      # 東西的前提下驗到 merge 需要的權限確實到位。
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Report app identity and scope
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          echo "app-slug        : $APP_SLUG"
          echo "installation-id : $INSTALLATION_ID"
          echo "--- repos this token can access ---"
          gh api /installation/repositories --jq '.repositories[].full_name'
          echo "--- read PRs with the app token ---"
          gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open" --jq '.[] | "#\(.number) \(.title)"'
