name: Android APK

# android/ 的建置與發佈（docs/android-app.md）。網頁本體仍由 deploy.yml 部署到 GitHub Pages，
# APK 只是載入它的殼，所以這裡只看 android/ 的變動。
#   PR：JVM unit test ＋ 產 APK（artifact）
#   push dev／手動執行：同上，上個 android-v* 之後 android/ 有新 commit 就自動發 GitHub Release
#   （版號與 release note 由 scripts/android-release.mjs 從 commit 產生；手動執行一律發）
on:
  push:
    branches: [dev]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

# 發版要看得到上一個 run 建的 tag 才算得出下一個版號 ⇒ 同分支的 run 排隊，不並行。
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      # 完整歷史＋tags：算版號與 release note 要從上個 android-v* tag 往後看。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # 簽章 keystore 只存在 secrets（不入 repo）。沒設定時（例如 fork 的 PR）照樣跑 test，
      # 只是 release APK 不簽，改上傳 debug APK。
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            echo "ANDROID_KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
          fi

      - name: Plan release
        id: plan
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        working-directory: .
        run: |
          node scripts/android-release.mjs \
            ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} \
            --notes-file="$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Version
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.release == 'true' && steps.plan.outputs.version || '' }}
        run: |
          echo "ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=${RELEASE_VERSION:-0.0.${{ github.run_number }}-dev}" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon test assembleRelease
            cp app/build/outputs/apk/release/app-release.apk pttchrome.apk
          else
            ./gradlew --no-daemon test assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk pttchrome.apk
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: pttchrome-apk
          path: android/pttchrome.apk

      - name: Publish release
        if: steps.plan.outputs.release == 'true' && env.ANDROID_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gh release create "$TAG" pttchrome.apk \
            --target "$GITHUB_SHA" \
            --title "Android $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
