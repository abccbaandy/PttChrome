name: Test

# Reusable workflow：三個測試 job（不含 live e2e）。
# 由 deploy.yml（push dev，後接 build/deploy）與 pr.yml（pull_request，只跑 test）共用。
on:
  workflow_call:

jobs:
  # 三個測試 job 平行跑。不含 live e2e：連真實 PTT、guest 名額常滿會 fast-fail，不適合當 gate。
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Unit tests
        run: |
          corepack enable
          yarn install --immutable
          yarn test:unit

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      # The Firebase emulator (auth+firestore) runs inside a pinned Docker image
      # (bundles firebase-tools + OpenJDK) so firebase-tools stays out of the
      # committed lockfile — Docker & Java are preinstalled on ubuntu runners,
      # and jest runs on the host against the container's exposed ports. See
      # scripts/run-integration.mjs / docs/pref-sync-firestore.md.
      - name: Integration tests (Firebase Emulator in Docker)
        env:
          # Cushion the in-test poll deadline against cold-start latency; the test
          # also auto-retries (jest.retryTimes) on CI. See tests/integration/.
          INTEGRATION_TIMEOUT_MS: "30000"
        run: |
          corepack enable
          yarn install --immutable
          yarn test:integration

  test-e2e-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Offline E2E tests (Playwright replay)
        run: |
          corepack enable
          yarn install --immutable
          npx playwright install --with-deps chromium
          yarn test:e2e:offline
