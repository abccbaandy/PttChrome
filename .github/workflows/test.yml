name: Test

# Reusable workflow：四個測試 job（不含 live e2e）。
# 由 deploy.yml（push dev，後接 build/deploy）與 pr.yml（pull_request，只跑 test）共用。
on:
  workflow_call:

jobs:
  # 四個測試 job 平行跑。不含 live e2e：連真實 PTT、guest 名額常滿會 fast-fail，不適合當 gate。
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Yarn v4 走 corepack：須先 enable，setup-node 的 cache:yarn 偵測（yarn cache dir）
      # 才會用 4.x；否則落到 runner 內建 yarn 1.22，遇 packageManager: yarn@4 直接報錯。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Unit tests
        run: |
          yarn install --immutable
          yarn test:unit

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Yarn v4/corepack：先 enable 再讓 setup-node 做 cache:yarn（詳見 test-unit 註解）。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # The Firebase emulator (auth+firestore) runs inside a pinned Docker image
      # (bundles firebase-tools + OpenJDK) so firebase-tools stays out of the
      # committed lockfile — Docker & Java are preinstalled on ubuntu runners,
      # and vitest runs on the host against the container's exposed ports. See
      # scripts/run-integration.mjs / docs/pref-sync-firestore.md.
      - name: Integration tests (Firebase Emulator in Docker)
        env:
          # Cushion the in-test poll deadline against cold-start latency; the test
          # also auto-retries (vitest retry) on CI. See tests/integration/.
          INTEGRATION_TIMEOUT_MS: "30000"
        run: |
          yarn install --immutable
          yarn test:integration

  test-e2e-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Yarn v4/corepack：先 enable 再讓 setup-node 做 cache:yarn（詳見 test-unit 註解）。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # `playwright install --with-deps` 會先跑 apt-get update。GitHub runner image 內建
      # 一個 Google Chrome 的 apt 來源，而它一旦處在「Release 宣告的雜湊與實際 Packages.gz
      # 對不起來」的發布中間態，apt-get update 就整包回 100 ⇒ 瀏覽器連下載都沒開始、
      # **一條測試都沒跑**，看起來卻像 e2e 整批爆炸（2026-09-09 實測：Release 宣告
      # 233e56de…、實際檔案 bc1428ab…，重跑兩次同樣紅，直接對 dl.google.com 抓下來比對
      # 也是同一組值 ⇒ 上游還在壞，不是隨機掉包，重跑無效）。
      # 我們跑的是 Playwright 自帶的 Chromium/Firefox，系統依賴全來自 Ubuntu 官方 archive，
      # **用不到**這個第三方來源 ⇒ 移掉它，CI 就不再被 Google 的發布狀態連坐。
      # 守護：tests/unit/ci_apt_sources.test.js（新增 e2e job 時別漏這一步）。
      - name: Drop unused Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*

      # firefox 是 offline-firefox project 用的（tests/e2e/offline/selection.offline.spec.js）：
      # issue #22 的選取／複製症狀只在 Firefox 出現，Chromium 永遠綠。
      - name: Offline E2E tests (Playwright replay)
        run: |
          yarn install --immutable
          npx playwright install --with-deps chromium firefox
          yarn test:e2e:offline

  # 逆境 offline e2e：同一批版面／座標敏感的 spec，但圖片改成「壞掉／很慢／混合」。
  # 目的是把 CI 偶發紅變成**必現紅** —— 本機 fixture 圖秒回，版面在測試量座標之前就
  # 穩了，所以「捲完立刻量 getBoundingClientRect」這類 bug 本機永遠測不出來
  #（50fa35c 的現場）。與上面三個 job 平行跑，牆鐘時間不變。
  # 情境是決定性的（固定延遲、URL 雜湊分桶），純函式守護在
  # tests/unit/offline_image_profile.test.js。
  test-e2e-offline-adverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Yarn v4/corepack：先 enable 再讓 setup-node 做 cache:yarn（詳見 test-unit 註解）。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # 同上面 test-e2e-offline 的說明（apt-get update 被內建的 Google Chrome 來源拖垮）。
      - name: Drop unused Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*

      # 只裝 chromium：逆境 project 不含 offline-firefox（那支是單行 feedLine，
      # 結構上不受延遲載入影響，見 tests/unit/e2e_layout_settle.test.js 的豁免名單）。
      - name: Adverse-image offline E2E (slow / broken / mixed)
        run: |
          yarn install --immutable
          npx playwright install --with-deps chromium
          yarn test:e2e:offline:adverse
