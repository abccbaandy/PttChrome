name: Test

# Reusable workflow：五個測試 job（不含 live e2e）＋一個給 e2e job 讀 Playwright 版本的小 job。
# 由 deploy.yml（push dev，後接 build/deploy）與 pr.yml（pull_request，只跑 test）共用。
on:
  workflow_call:

jobs:
  # 五個測試 job 平行跑。不含 live e2e：連真實 PTT、guest 名額常滿會 fast-fail，不適合當 gate。
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Yarn v4 走 corepack：須先 enable，setup-node 的 cache:yarn 偵測（yarn cache dir）
      # 才會用 4.x；否則落到 runner 內建 yarn 1.22，遇 packageManager: yarn@4 直接報錯。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # 同一份設定 unit 耗時在 64s～171s 間跳（各階段比例幾乎不變 ⇒ 疑似 runner 機型差異）。
      # 印機型供對照 log 裡 vitest 的 Duration；確認與 CPU 相關再調 --maxWorkers。
      - name: Runner CPU
        run: |
          nproc
          lscpu | grep 'Model name' || true

      - name: Unit tests
        run: |
          yarn install --immutable
          yarn test:unit

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Yarn v4/corepack：先 enable 再讓 setup-node 做 cache:yarn（詳見 test-unit 註解）。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # The Firebase emulator (auth+firestore) runs inside a pinned Docker image
      # (bundles firebase-tools + OpenJDK) so firebase-tools stays out of the
      # committed lockfile — Docker & Java are preinstalled on ubuntu runners,
      # and vitest runs on the host against the container's exposed ports. See
      # scripts/run-integration.mjs / docs/pref-sync-firestore.md.
      - name: Integration tests (Firebase Emulator in Docker)
        env:
          # Cushion the in-test poll deadline against cold-start latency; the test
          # also auto-retries (vitest retry) on CI. See tests/integration/.
          INTEGRATION_TIMEOUT_MS: "30000"
        run: |
          yarn install --immutable
          yarn test:integration

  # e2e job 用的 Playwright 官方 Docker image 版本（＝yarn.lock 裡 @playwright/test 的版本）。
  # 不寫死在下面的 container.image：image 內建瀏覽器必須與 npm 套件同版，Dependabot 升版
  # 只改 yarn.lock，寫死就是每次升版都紅。只讀檔不 install，約 10 秒。
  # 守護：tests/unit/ci_playwright_container.test.js。
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            yarn.lock
            scripts/playwright-version.mjs
          sparse-checkout-cone-mode: false
      - id: v
        run: node scripts/playwright-version.mjs >> "$GITHUB_OUTPUT"

  # e2e job 一律跑在 Playwright 官方 image 裡：瀏覽器與系統依賴都已內建，不跑
  # `playwright install --with-deps`。理由：那一步底下是 apt，速度看 Ubuntu 鏡像站臉色
  #（實測同一輪兩個 job，一個 37 秒、另一個卡 414 秒），還會被 runner 內建的第三方 apt
  # 來源連坐（Google Chrome 來源發布中間態 ⇒ apt-get update 整包回 100）。
  # `--user 1001`＝runner 使用者，checkout／cache 的檔案權限才對得上；`--ipc=host` 是
  # Playwright 官方建議：Docker 預設 /dev/shm 只有 64MB，多 worker 的 Chromium 會被它撐爆。
  #
  # 拆兩個 shard 平行跑（fullyParallel ⇒ 以 test 為單位切，兩邊各約一半）。shard 數再加
  # 不划算：每個 job 固定付 ~30s 拉 image＋yarn install。
  test-e2e-offline-shard:
    needs: playwright-version
    runs-on: ubuntu-latest
    strategy:
      # 一個 shard 紅不砍另一個：要看到整輪所有失敗，而不是修一條才冒下一條。
      fail-fast: false
      matrix:
        shard: [1, 2]
    # 卡住保險：預設 360 分鐘，而 deploy.yml 的 concurrency 不取消舊 run ⇒ 一個卡住的 job
    # 會讓之後所有 push 排隊（2026-10-01：dev server 沒起來、子進程撐住 node 不退出）。
    # 數值＝串行時代的實測耗時（14／17 分）再放兩倍多，正常不可能碰到。
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7

      # Yarn v4/corepack：先 enable 再讓 setup-node 做 cache:yarn（詳見 test-unit 註解）。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # firefox 是 offline-firefox project 用的（tests/e2e/offline/selection.offline.spec.js）：
      # issue #22 的選取／複製症狀只在 Firefox 出現，Chromium 永遠綠。image 已內建。
      # Yarn v4 把多出的參數接在 script 尾端 ⇒ --shard 落在 playwright 指令上。
      - name: Offline E2E tests (Playwright replay, shard ${{ matrix.shard }}/2)
        run: |
          yarn install --immutable
          yarn test:e2e:offline --shard=${{ matrix.shard }}/2

  # required checks 綁的是 job 名（`test / test-e2e-offline`），matrix 會把名字變成
  # `test-e2e-offline-shard (1)` ⇒ 用這個收斂 job 維持原名，分支保護不必跟著 shard 數改。
  # `if: always()` 不能省：上游失敗時沒有它，這個 job 會是 skipped，而 skipped 對
  # required check 等於通過。守護 tests/unit/ci_playwright_container.test.js。
  test-e2e-offline:
    needs: test-e2e-offline-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-e2e-offline-shard.result }}" = success

  # 逆境 offline e2e：同一批版面／座標敏感的 spec，但圖片改成「壞掉／很慢／混合」。
  # 目的是把 CI 偶發紅變成**必現紅** —— 本機 fixture 圖秒回，版面在測試量座標之前就
  # 穩了，所以「捲完立刻量 getBoundingClientRect」這類 bug 本機永遠測不出來
  #（50fa35c 的現場）。與上面三個 job 平行跑，牆鐘時間不變。
  # 情境是決定性的（固定延遲、URL 雜湊分桶），純函式守護在
  # tests/unit/offline_image_profile.test.js。
  #
  # 三桶各一個 job 平行跑（matrix）。本機 runner 串行是為了 Windows 的 STATUS_DLL_INIT_FAILED
  #（scripts/run-adverse-e2e.mjs 檔頭），CI 是 Linux 沒有這個限制。
  test-e2e-offline-adverse-bucket:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # workers：slow 桶的時間大多花在等刻意延遲的圖片（Playwright 進程裡的計時器，
        # 不吃 CPU），可以開得比 vCPU 多；broken／mixed 吃 CPU（2→8 workers 幾乎沒變快），
        # 一台 4 vCPU 就給 4。
        include:
          - bucket: offline-slow
            workers: 8
          - bucket: offline-broken
            workers: 4
          - bucket: offline-mixed
            workers: 4
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7

      # Yarn v4/corepack：先 enable 再讓 setup-node 做 cache:yarn（詳見 test-unit 註解）。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # E2E_WORKERS 見上面 matrix 註解；其餘 offline job 用預設值（tests/e2e/workers_policy.js）。
      - name: Adverse-image offline E2E (${{ matrix.bucket }})
        env:
          E2E_WORKERS: ${{ matrix.workers }}
        run: |
          yarn install --immutable
          yarn test:e2e:offline:adverse --only=${{ matrix.bucket }}

  # 同 test-e2e-offline 的收斂 job：維持 required check 名稱 `test / test-e2e-offline-adverse`。
  test-e2e-offline-adverse:
    needs: test-e2e-offline-adverse-bucket
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-e2e-offline-adverse-bucket.result }}" = success

  # proxy/imgur-worker 是獨立的 npm 子專案（Cloudflare Worker 代理，非 yarn workspace），
  # 上面四個 job 一條都掃不到它 —— 它們跑的是 yarn 的 test:unit / test:integration /
  # test:e2e:offline*，include 全指向根目錄的 tests/。所以在這個 job 之前，Dependabot
  # 改到 proxy/imgur-worker/package-lock.json 的 PR，那排綠勾與該改動**完全無關**
  #（實例：PR #29 的 vitest 4→5 major bump，五個 check 全綠但一條 worker 測試都沒跑，
  # 只能靠人在本機 npm ci && npm test 才驗得到）。
  # 成本極低（純 node 測試，55 條約 0.2 秒），與其他 job 平行跑，牆鐘時間不變。
  # 守護：tests/unit/ci_imgur_worker_job.test.js。
  test-imgur-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 這個子專案用 npm（自帶 package-lock.json），不走 corepack/yarn ⇒ 不需要上面
      # 那套「先 enable corepack 再 cache:yarn」的兩段式 setup-node。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: proxy/imgur-worker/package-lock.json

      - name: Worker tests (npm)
        working-directory: proxy/imgur-worker
        run: |
          npm ci
          npm test
