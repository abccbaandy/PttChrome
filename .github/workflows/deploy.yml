name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

# 讓 GITHUB_TOKEN 可部署 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，新 push 取代進行中的（不取消已完成的 run）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 三個測試 job 平行跑，build 需全部通過才開始（任一失敗即擋下 deploy）。
  # 不含 live e2e：連真實 PTT、guest 名額常滿會 fast-fail，不適合當部署 gate。
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Unit tests
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn test:unit

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      # Firestore emulator 是 jar，需 Java（emulator jar 由 firebase-tools 執行時自抓）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Integration tests (Firebase Emulator)
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn test:integration

  test-e2e-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Offline E2E tests (Playwright replay)
        run: |
          corepack enable
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium
          yarn test:e2e:offline

  build:
    needs: [test-unit, test-integration, test-e2e-offline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Build
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
