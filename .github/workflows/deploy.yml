name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

# 讓 GITHUB_TOKEN 可部署 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，新 push 取代進行中的（不取消已完成的 run）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      # webpack4 在 Node17+ 需要 legacy OpenSSL provider
      - name: Build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
