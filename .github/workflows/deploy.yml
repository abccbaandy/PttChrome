name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

# 讓 GITHUB_TOKEN 可部署 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，新 push 取代進行中的（不取消已完成的 run）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # test 定義抽到 test.yml（reusable），與 pr.yml 共用。任一測試 job 失敗即擋下 build/deploy。
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Build
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
