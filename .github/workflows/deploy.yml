name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

# 讓 GITHUB_TOKEN 可部署 Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # test 定義抽到 test.yml（reusable），與 pr.yml 共用。任一測試 job 失敗即擋下 deploy。
  test:
    uses: ./.github/workflows/test.yml

  # build 不等測試、與 test 平行跑（省 ~20s）；測試紅時 Pages artifact 照樣上傳，但 deploy
  # 被 needs: test 擋住，不會部署。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Yarn v4/corepack：先 enable 再讓 setup-node 做 cache:yarn（詳見 test.yml 註解）。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Build
        run: |
          yarn install --immutable
          yarn build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # concurrency 只鎖這個 job，不鎖整個 workflow：兩個部署同時寫 Pages 才會互蓋，測試沒有
  # 這個問題。鎖在 workflow 層級時，連續 push 的測試要整輪排隊（一輪卡住後面全等）。
  # cancel-in-progress: false ＝不砍正在部署的那個；排隊中的只留最新一個（GitHub 語意）。
  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 鎖只在這個 job ⇒ 各輪測試平行跑，舊 commit 的測試若比較慢，它的部署可能排在新
      # commit 之後，把站台蓋回舊版。這一步在**拿到鎖之後**才檢查，branch 已經有更新的
      # commit 就不部署（那個更新的 run 會自己部署）。守護 tests/unit/ci_deploy_concurrency.test.js。
      - name: Skip if a newer commit is already on the branch
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)"
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "${{ github.ref_name }} 已前進到 $head，略過 ${{ github.sha }} 的部署。"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - id: deployment
        if: steps.latest.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5

  # Firestore 規則（firestore.rules）跟著站台一起上線，不用再手動 firebase deploy。
  # 要 repo secret FIREBASE_SERVICE_ACCOUNT（GCP 服務帳戶的 JSON 金鑰，角色「Firebase Rules Admin」
  # ＋「Service Usage Consumer」）；沒設就只印提示、不算失敗（docs/pref-sync-firestore.md）。
  # 規則部署是整份覆蓋 ⇒ 跟 deploy 一樣拿到鎖後先確認自己仍是最新 commit，舊 commit 不蓋回舊規則。
  firestore-rules:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: firestore-rules
      cancel-in-progress: false
    steps:
      - name: Skip if a newer commit is already on the branch
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::沒有 FIREBASE_SERVICE_ACCOUNT secret，略過 Firestore 規則部署（設定方法見 docs/pref-sync-firestore.md）。"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head="$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)"
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "${{ github.ref_name }} 已前進到 $head，略過 ${{ github.sha }} 的規則部署。"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.latest.outputs.deploy == 'true'

      - uses: actions/setup-node@v7
        if: steps.latest.outputs.deploy == 'true'
        with:
          node-version: 24

      - name: Deploy Firestore rules
        if: steps.latest.outputs.deploy == 'true'
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          key="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$SA_KEY" > "$key"
          GOOGLE_APPLICATION_CREDENTIALS="$key" npx --yes firebase-tools@15 deploy --only firestore:rules --non-interactive
          rm -f "$key"
