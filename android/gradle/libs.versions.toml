[versions]
agp = "9.4.1"
kotlin = "2.4.20"
okhttp = "5.5.0"
webkit = "1.17.1"
credentials = "1.6.0"
googleid = "1.2.1"
activity = "1.13.0"
fragment = "1.9.1"
coroutines = "1.11.0"
junit = "4.13.2"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
# 雲端同步的 Google 登入（GetSignInWithGoogleOption／GoogleIdTokenCredential）。
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
# credentials-play-services-auth 經 play-services-auth 帶進舊版 fragment（<1.3）⇒ registerForActivityResult 失效；明確釘新版。
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
